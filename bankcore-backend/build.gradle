plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.bankcore'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 1. Capa Web y REST
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 2. Persistencia JPA / Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 3. Validación Defensiva Jakarta
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 4. Broker de Mensajería RabbitMQ
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // 5. Métricas & Observabilidad (DevOps Actuator)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 6. Documentación OpenAPI 3 & Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // 7. Reducción de Boilerplate (Lombok para inyección por constructor)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 8. Drivers de Base de Datos (H2 para pruebas locales, PostgreSQL para Docker/Prod)
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    // 9. Testing Enterprise (JUnit 5, Mockito, AssertJ)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
