plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
    id 'org.sonarqube' version '5.1.0.4882'
    id 'info.solidsoft.pitest' version '1.15.0'
}

group = 'com.bankcore'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 1. Capa Web y REST
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 2. Persistencia JPA / Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 3. Validación Defensiva Jakarta
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 4. Broker de Mensajería RabbitMQ
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // 5. Métricas & Observabilidad (DevOps Actuator)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 6. Documentación OpenAPI 3 & Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // 7. Reducción de Boilerplate (Lombok para inyección por constructor)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 8. Drivers de Base de Datos (H2 para pruebas locales, PostgreSQL para Docker/Prod)
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    // 9. Testing Enterprise (JUnit 5, Mockito, AssertJ)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 10. Gobernanza y Pruebas de Arquitectura (Fitness Functions)
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

// Configuración JaCoCo (Cobertura de Código)
jacoco {
    toolVersion = "0.8.12"
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs("-XX:+EnableDynamicAgentLoading", "-Xshare:off")
    finalizedBy tasks.jacocoTestReport
    testLogging {
        events "failed"
        exceptionFormat "full"
        showExceptions true
        showCauses true
    }
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
}

// Configuración SonarQube (Quality Gates & SAST)
sonar {
    properties {
        property "sonar.projectKey", "bankcore-backend"
        property "sonar.projectName", "BankCore Digital Backend"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
        property "sonar.exclusions", "**/config/**,**/dto/**"
    }
}

// Configuración PITest (Mutation Testing)
pitest {
    targetClasses = ['com.bankcore.backend.domain.*', 'com.bankcore.backend.service.*']
    targetTests = ['com.bankcore.backend.*']
    pitestVersion = '1.16.1'
    junit5PluginVersion = '1.2.1'
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
}
