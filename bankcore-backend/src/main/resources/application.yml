server:
  port: 8080

spring:
  application:
    name: bankcore-backend

  # 1. Base de datos (H2 en memoria por defecto para desarrollo local ágil, sobreescribible por variables de entorno)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:bankcoredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  # 2. Configuración JPA / Hibernate
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 3. Consola H2 para inspección rápida en http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

  # 4. Broker de Mensajería RabbitMQ (Configurable para Docker Compose)
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

# 5. Métricas & Observabilidad (DevOps Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# 6. Documentación OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
