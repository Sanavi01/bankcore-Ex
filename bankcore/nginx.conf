server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ====================================================================
    # CABECERAS BANCARIAS DE SEGURIDAD ESTRICTA (Subtema 4.2 / OWASP)
    # ====================================================================
    # Prevención de Clickjacking: Evita que el portal bancario sea embebido en iframes
    add_header X-Frame-Options "DENY" always;

    # Prevención de MIME Sniffing: Fuerza al navegador a respetar los Content-Type declarados
    add_header X-Content-Type-Options "nosniff" always;

    # Protección contra ataques XSS en navegadores legados
    add_header X-XSS-Protection "1; mode=block" always;

    # Política de Referrer: No fuga datos de URLs bancarias en peticiones salientes
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy (CSP): Política estricta de orígenes permitidos
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' http://localhost:8080 http://bankcore-backend:8080;" always;

    # Gzip Compression para alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Gestión de rutas SPA (Single Page Application):
    # Si la ruta no es un archivo físico (ej. /transferencias), redirige a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso transparente hacia la API del backend
    location /api/ {
        proxy_pass http://bankcore-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache agresivo para estáticos inmutables con hash
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
